name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same LLVM release as the dev box. clang-format output is
      # not stable across releases, so an unpinned one would reject files that
      # are correctly formatted locally.
      - run: python3 -m pip install --user --break-system-packages clang-format==22.1.8
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: git ls-files -z '*.hpp' '*.cpp' | xargs -0 -r clang-format --style=file --dry-run --Werror

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # gcc 16, same major as the dev box: -std=c++26 is the real thing here,
    # not the half-supported spelling that noble's gcc 13/14 would give.
    container: gcc:16.2.0-trixie
    strategy:
      fail-fast: false
      matrix:
        config: [ci, asan, ubsan]
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Required under `container:`: the image has no pre-installed
          # bazelisk, and the empty default installs nothing.
          bazelisk-version: 1.x
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.config }}
          repository-cache: true

      - run: bazel test --config=${{ matrix.config }} //...
